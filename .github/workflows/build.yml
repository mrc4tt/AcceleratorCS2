name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - steamrt3
          - steamrt4
          - windows

jobs:
  windows:
    name: Windows Build
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    env:
      HL2SDKCS2: ${{ github.workspace }}/hl2sdk-cs2
      MMSOURCE_DEV: ${{ github.workspace }}/mmsource-2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: AcceleratorCS2
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Install Premake5
        uses: abel0b/setup-premake@v2.4
        with:
          version: '5.0.0-beta8'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        working-directory: AcceleratorCS2
        run: |
          # Stop at the first failing command, otherwise a compile error only shows up later as a missing DLL.
          $PSNativeCommandUseErrorActionPreference = $true
          premake5 vs2026
          msbuild build/AcceleratorCS2.slnx /m /p:Configuration=Release /p:Platform=x64
          premake5 package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: AcceleratorCS2/build/package/AcceleratorCS2

  steamrt3:
    name: SteamRT3
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt3' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt3
      artifact: SteamRT3

  steamrt4:
    name: SteamRT4
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt4' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt4
      artifact: SteamRT4

  # Releases automatically: on a push to master, the version returned by AcceleratorCS2::GetVersion()
  # in extension.cpp is read, and if tag v<version> doesn't exist yet it's created together with a
  # GitHub release. So bumping GetVersion() is all it takes to publish a release; other pushes don't
  # release anything. Pushing a tag by hand still releases that tag.
  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [windows, steamrt3, steamrt4]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(grep -A2 'AcceleratorCS2::GetVersion()' extension.cpp | sed -n 's/.*return "\(.*\)".*/\1/p')"
            if [ -z "$version" ]; then
              echo "::error::could not read the version from AcceleratorCS2::GetVersion() in extension.cpp"
              exit 1
            fi
            tag="v$version"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do (bump GetVersion() to publish a new one)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        if: steps.version.outputs.publish == 'true'
        working-directory: artifacts
        run: |
          name="${{ github.event.repository.name }}-${{ steps.version.outputs.tag }}"
          (cd SteamRT3 && tar -czf "../$name-steamrt3.tar.gz" *)
          (cd SteamRT4 && tar -czf "../$name-steamrt4.tar.gz" *)
          (cd Windows && zip -qr "../$name-windows.zip" *)
          ls -la *.tar.gz *.zip

      # Creates the tag on this commit if it doesn't exist. Tags created with the workflow token don't
      # trigger another workflow run, so this doesn't build twice.
      - name: Release
        if: steps.version.outputs.publish == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "### Metamod \`2.0-1461\` or later is required!" \
            --generate-notes \
            artifacts/*.tar.gz artifacts/*.zip
