name: CI

# Manual only: releases are built and published on the build server (cs2-build-system, started from
# server-ops), local builds use scripts/build-*.sh. Run it from Actions -> CI -> Run workflow when a
# hosted build is wanted.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - steamrt3
          - steamrt4
          - windows

jobs:
  windows:
    name: Windows Build
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    env:
      HL2SDKCS2: ${{ github.workspace }}/hl2sdk-cs2
      MMSOURCE_DEV: ${{ github.workspace }}/mmsource-2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: AcceleratorCS2
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: mrc4tt/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Install Premake5
        uses: abel0b/setup-premake@v2.4
        with:
          version: '5.0.0-beta8'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        working-directory: AcceleratorCS2
        run: |
          # Stop at the first failing command, otherwise a compile error only shows up later as a missing DLL.
          $PSNativeCommandUseErrorActionPreference = $true
          premake5 vs2026
          msbuild build/AcceleratorCS2.slnx /m /p:Configuration=Release /p:Platform=x64
          premake5 package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: AcceleratorCS2/build/package/AcceleratorCS2

  steamrt3:
    name: SteamRT3
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt3' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt3
      artifact: SteamRT3

  steamrt4:
    name: SteamRT4
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt4' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt4
      artifact: SteamRT4
