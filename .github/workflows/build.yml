name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        default: all
        options:
          - all
          - steamrt3
          - steamrt4
          - windows

jobs:
  windows:
    name: Windows Build
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    env:
      HL2SDKCS2: ${{ github.workspace }}/hl2sdk-cs2
      MMSOURCE_DEV: ${{ github.workspace }}/mmsource-2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: AcceleratorCS2
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Install Premake5
        uses: abel0b/setup-premake@v2.4
        with:
          version: '5.0.0-beta8'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build
        working-directory: AcceleratorCS2
        run: |
          premake5 vs2026
          msbuild build/AcceleratorCS2.slnx /m /p:Configuration=Release /p:Platform=x64
          premake5 package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: AcceleratorCS2/build/package/AcceleratorCS2

  steamrt3:
    name: SteamRT3
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt3' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt3
      artifact: SteamRT3

  steamrt4:
    name: SteamRT4
    if: ${{ !inputs.target || inputs.target == 'all' || inputs.target == 'steamrt4' }}
    uses: ./.github/workflows/linux-build.yml
    with:
      runtime: steamrt4
      artifact: SteamRT4

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, steamrt3, steamrt4]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          if [ -d "./SteamRT3/" ]; then
            cd ./SteamRT3/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt3.tar.gz *
            cd -
          fi
          if [ -d "./SteamRT4/" ]; then
            cd ./SteamRT4/
            tar -czf ../${{ github.event.repository.name }}-${version}-steamrt4.tar.gz *
            cd -
          fi
          if [ -d "./Windows/" ]; then
            cd ./Windows/
            zip -r ../${{ github.event.repository.name }}-${version}-windows.zip *
            cd -
          fi

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.event.repository.name }}-*
          tag: ${{ github.ref }}
          file_glob: true
